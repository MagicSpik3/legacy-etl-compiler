Operation: batch_op_031_compute
  Type:    BATCH_COMPUTE
  Inputs:  ['ds_025_materialized']
  Outputs: ['ds_046_derived']
  Params:  {'computes': [{'target': 'dob_num', 'expression': 'NUMBER ( dob , F8.0 )'}, {'target': 'claim_start_num', 'expression': 'NUMBER ( claim_start , F8.0 )'}, {'target': 'claim_end_num', 'expression': 'NUMBER ( claim_end , F8.0 )'}, {'target': 'dob_date', 'expression': 'DATE.MDY ( TRUNC ( MOD ( dob_num , 10000 ) / 100 ) , MOD ( dob_num , 100 ) , TRUNC ( dob_num / 10000 ) )'}, {'target': 'claim_start_date', 'expression': 'DATE.MDY ( TRUNC ( MOD ( claim_start_num , 10000 ) / 100 ) , MOD ( claim_start_num , 100 ) , TRUNC ( claim_start_num / 10000 ) )'}, {'target': 'claim_end_date', 'expression': 'DATE.MDY ( TRUNC ( MOD ( claim_end_num , 10000 ) / 100 ) , MOD ( claim_end_num , 100 ) , TRUNC ( claim_end_num / 10000 ) )'}, {'target': 'age_years', 'expression': 'TRUNC ( ( claim_start_date - dob_date ) / ( 365.25 * 86400 ) )'}, {'target': 'age_valid', 'expression': '1'}, {'target': 'age_valid', 'expression': '0', 'condition': 'age_years < min_age_n'}, {'target': 'age_valid', 'expression': '0', 'condition': 'age_years > max_age_n'}, {'target': 'status_valid', 'expression': '1'}, {'target': 'status_valid', 'expression': '0', 'condition': 'RTRIM ( status ) = RTRIM ( exclude_status_s )'}, {'target': 'ref_year', 'expression': 'TRUNC ( reference_month_n / 100 )'}, {'target': 'ref_month', 'expression': 'MOD ( reference_month_n , 100 )'}, {'target': 'month_start', 'expression': 'DATE.MDY ( ref_month , 1 , ref_year )'}, {'target': 'month_end', 'expression': 'DATE.MDY ( ref_month + 1 , 1 , ref_year ) - 1'}, {'target': 'eligible_start', 'expression': 'MAX ( claim_start_date , month_start )'}, {'target': 'eligible_end', 'expression': 'MIN ( claim_end_date , month_end )'}, {'target': 'eligible_days', 'expression': '( eligible_end - eligible_start ) / 86400 + 1'}, {'target': 'eligible_days', 'expression': '0', 'condition': 'eligible_days < 0'}]}

Operation: op_052_sort
  Type:    SORT_ROWS
  Inputs:  ['ds_046_derived']
  Outputs: ['ds_047_sorted']
  Params:  {'keys': 'benefit_type', 'order': 'ascending'}

Operation: op_053_join
  Type:    JOIN
  Inputs:  ['ds_047_sorted', 'file_benefit_rates.sav']
